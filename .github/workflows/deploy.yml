# ============================================================================
# SriniMart CI/CD
# On push/PR to main: install deps, run unit tests, then deploy the app
# (Firebase Hosting, Firestore rules, Storage rules) to the srini-mart project.
#
# Setup:
#   1. firebase login:ci  ->  copy the token
#   2. Add the token as a repository secret named FIREBASE_TOKEN
# ============================================================================

name: Deploy SriniMart

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm test

  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy hosting, firestore rules, indexes and storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting,firestore,storage --non-interactive --project srini-mart
