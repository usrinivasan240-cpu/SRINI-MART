# ============================================================================
# SriniMart CI/CD
# ⭐ WHAT THIS FILE IS (plain English):
#     GitHub's automatic helper ("workflow"). Every time new code is pushed to
#     the "main" branch, GitHub runs this file on its own computers: first it
#     installs the app's dependencies and runs the unit tests; only if the
#     tests pass does it deploy the site to Firebase (Hosting pages, Firestore
#     rules + indexes, Storage rules). If tests fail, nothing is deployed.
#
# Setup (one time, in the GitHub repo):
#   1. Copy the FULL contents of your Firebase service-account JSON file
#      (the "srini-mart-firebase-adminsdk-*.json" file in the project root).
#   2. In GitHub: repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret. Name it FIREBASE_SERVICE_ACCOUNT and paste the
#      whole JSON as the value. This is how the deploy step logs into Firebase.
# ============================================================================

name: Deploy SriniMart

# When this runs: on every push to "main", or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: quality gate — make sure the app's logic still passes its tests.
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm test

  # Job 2: deploy — only runs after the test job finishes successfully.
  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # Write the service-account key (stored safely as a GitHub secret) to a
      # file. GitHub hides the value in the logs, so it is never printed.
      - name: Prepare Firebase service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing secret: add FIREBASE_SERVICE_ACCOUNT (the full service-account JSON) in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-sa.json"

      - name: Deploy hosting, firestore rules, indexes and storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "$HOME/firebase-sa.json"
        run: firebase deploy --only hosting,firestore,storage --non-interactive --project srini-mart
