# ============================================================================
# SriniMart CI/CD
# ⭐ WHAT THIS FILE IS (plain English):
#     GitHub's automatic helper ("workflow"). Every time new code is pushed to
#     the "main" branch, GitHub runs this file on its own computers: first it
#     installs the app's dependencies and runs the unit tests; only if the
#     tests pass does it deploy the site to Firebase (Hosting pages, Firestore
#     rules + indexes, Storage rules). If tests fail, nothing is deployed.
#
# Setup:
#   1. firebase login:ci  ->  copy the token
#   2. Add the token as a repository secret named FIREBASE_TOKEN
# ============================================================================

name: Deploy SriniMart

# When this runs: on every push to "main", or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: quality gate — make sure the app's logic still passes its tests.
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm test

  # Job 2: deploy — only runs after the test job finishes successfully.
  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy hosting, firestore rules, indexes and storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting,firestore,storage --non-interactive --project srini-mart
