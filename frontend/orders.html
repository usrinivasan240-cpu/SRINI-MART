<!DOCTYPE html>
<!-- ============================================================================
  File:    orders.html
  Purpose: Buyer order history, status tracking, and order cancellation.
  ⭐ WHAT THIS PAGE IS (plain English):
     Lists every order this buyer has placed, newest first, with a status badge
     (Pending → Processing → Shipped → Delivered, or Cancelled). The "View
     Details" button expands an order to show the delivery address and price
     breakdown. "Cancel Order" is only available while the order is still
     Pending or Processing. The list updates live via js/orders.js.
  Used by: buyers.
============================================================================= -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - SriniMart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Shared top navigation bar. -->
    <nav class="topbar">
        <div class="topbar-inner">
            <a href="buyer.html" class="topbar-brand">SriniMart</a>
            <div class="topbar-links">
                <a href="buyer.html">Browse</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html" class="active">My Orders</a>
                <a href="profile.html">Profile</a>
            </div>
            <div class="topbar-user">
                <div class="user-avatar" id="userAvatar"></div>
                <div class="user-meta">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <button class="btn btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="page">
        <div class="page-header">
            <div class="container">
                <h1>My Orders</h1>
                <p>Track and manage your orders.</p>
            </div>
        </div>

        <div class="container mt-24">
            <!-- js/orders.js fills this with order cards (and the empty state
                 message if there are none yet). -->
            <div id="orderList"><div class="muted">Loading orders...</div></div>
        </div>
    </div>

    <div class="toast-container"></div>

    <!-- The page brain + the floating chat assistant. -->
    <script type="module" src="js/orders.js"></script>
    <script type="module" src="js/chatbot.js"></script>
</body>
</html>
