<!DOCTYPE html>
<!-- ============================================================================
  File:    login.html
  Purpose: Sign-in and account-creation page (public, no login required).
  ⭐ WHAT THIS PAGE IS (plain English):
     The front door of the app. Visitors can either "Login" with their email
     + password, or "Register" as a Buyer or Seller. Sign-up also creates a
     user record in the database. SPECIAL RULE: the very first account that is
     ever created becomes the platform Admin (it gets admin.html access).
     The logic lives in the <script> at the bottom of this page; it talks to
     Firebase via ./js/firebase.js and ./js/ui.js.
  Used by: everyone who isn't signed in yet.
============================================================================= -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SriniMart - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Brand + tagline at the top of the card. -->
            <div class="auth-logo">
                <a href="index.html" class="nav-logo">SriniMart</a>
                <p>Enterprise Multi-Seller Marketplace</p>
            </div>

            <!-- The two tabs that switch between the Login and Register forms. -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showTab('login')">Login</button>
                <button class="auth-tab" onclick="showTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <!-- Email + password; submitted to Firebase on "Sign In". -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    <span class="error-text">Please enter a valid email</span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required minlength="8">
                    <span class="error-text">Password must be at least 8 characters</span>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
            </form>

            <!-- Register Form -->
            <!-- Hidden until the "Register" tab is clicked. New accounts pick
                 Buyer or Seller; the very first account becomes Admin. -->
            <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="regFirstName">First Name</label>
                        <input type="text" id="regFirstName" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label for="regLastName">Last Name</label>
                        <input type="text" id="regLastName" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Min 8 characters" required minlength="8">
                </div>

                <div class="form-group">
                    <label for="regRole">Account Type</label>
                    <select id="regRole" required>
                        <option value="buyer">Buyer - Shop on the marketplace</option>
                        <option value="seller">Seller - Sell your products</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" id="registerBtn">Create Account</button>
            </form>

            <!-- The little "Don't have an account? / Already have an account?"
                 link that switches between the two tabs. -->
            <div class="auth-footer">
                <p id="authFooterText">Don't have an account? <a href="#" onclick="showTab('register')">Sign up</a></p>
            </div>
        </div>
    </div>

    <div class="toast-container"></div>

    <!-- ============================================================================
         Page brain (inline module script).
         Uses the shared Firebase + UI helpers instead of a separate .js file.
    ============================================================================ -->
    <!-- Firebase SDKs -->
    <script type="module">
        import { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword,
                 updateProfile, collection, getDocs, doc, setDoc, getDoc, onAuthStateChanged } from "./js/firebase.js";
        import { toast, setLoading } from "./js/ui.js";

        // --- Tab switching -----------------------------------------------------------
        // showTab('login' | 'register'): shows one form and hides the other.
        window.showTab = function(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabs = document.querySelectorAll('.auth-tab');
            const footerText = document.getElementById('authFooterText');

            tabs.forEach(t => t.classList.remove('active'));

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabs[0].classList.add('active');
                footerText.innerHTML = 'Don\'t have an account? <a href="#" onclick="showTab(\'register\')">Sign up</a>';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabs[1].classList.add('active');
                footerText.innerHTML = 'Already have an account? <a href="#" onclick="showTab(\'login\')">Sign in</a>';
            }
        };

        // --- Login handler -----------------------------------------------------------
        // Checks the email + password with Firebase, reads the user's role from
        // the database, then sends them to their correct homepage.
        window.handleLogin = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            setLoading(btn, true);

            try {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Get user data from Firestore (falls back to "buyer" if missing).
                const userDoc = await getDoc(doc(db, "users", user.uid));
                let userData = { uid: user.uid, email: user.email, role: 'buyer' };

                if (userDoc.exists()) {
                    userData = { ...userData, ...userDoc.data() };
                }

                // Get ID token (proof of login, kept in the browser for later use).
                const idToken = await user.getIdToken();

                // Store in localStorage
                localStorage.setItem('srinimart_token', idToken);
                localStorage.setItem('srinimart_user', JSON.stringify(userData));

                toast('Login successful!', 'success');

                // Redirect based on role
                setTimeout(() => {
                    if (userData.role === 'admin') window.location.href = 'admin.html';
                    else if (userData.role === 'seller') window.location.href = 'seller.html';
                    else window.location.href = 'buyer.html';
                }, 500);

            } catch (error) {
                // Turn Firebase's raw error codes into friendly messages.
                let message = 'Login failed';
                if (error.code === 'auth/user-not-found') message = 'No account found with this email';
                else if (error.code === 'auth/wrong-password') message = 'Incorrect password';
                else if (error.code === 'auth/invalid-email') message = 'Invalid email address';
                else if (error.code === 'auth/too-many-requests') message = 'Too many attempts. Try again later';
                else message = error.message;
                toast(message, 'error');
            } finally {
                setLoading(btn, false);
            }
        };

        // --- Register handler --------------------------------------------------------
        // Creates the Firebase login, writes the user's details + chosen role to
        // the users table, and sends them to their homepage.
        window.handleRegister = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            setLoading(btn, true);

            try {
                const firstName = document.getElementById('regFirstName').value;
                const lastName = document.getElementById('regLastName').value;
                const email = document.getElementById('regEmail').value;
                const password = document.getElementById('regPassword').value;
                const role = document.getElementById('regRole').value;

                // Bootstrap: the very first account ever created becomes Admin.
                let finalRole = role;
                if (role !== 'admin') {
                    const existingUsers = await getDocs(collection(db, 'users'));
                    if (existingUsers.empty) finalRole = 'admin';
                }

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Update display name (what Firebase shows on the account).
                await updateProfile(user, { displayName: `${firstName} ${lastName}` });

                // Save user data to Firestore
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    email: email,
                    firstName: firstName,
                    lastName: lastName,
                    role: finalRole,
                    isActive: true,
                    isVerified: false,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });

                // Get ID token
                const idToken = await user.getIdToken();

                // Store in localStorage
                localStorage.setItem('srinimart_token', idToken);
                localStorage.setItem('srinimart_user', JSON.stringify({
                    uid: user.uid,
                    email: email,
                    firstName: firstName,
                    lastName: lastName,
                    role: finalRole
                }));

                toast(finalRole === 'admin' ? 'Admin account created!' : 'Account created successfully!', 'success');

                // Redirect based on role
                setTimeout(() => {
                    if (finalRole === 'admin') window.location.href = 'admin.html';
                    else if (finalRole === 'seller') window.location.href = 'seller.html';
                    else window.location.href = 'buyer.html';
                }, 500);

            } catch (error) {
                // Turn Firebase's raw error codes into friendly messages.
                let message = 'Registration failed';
                if (error.code === 'auth/email-already-in-use') message = 'An account with this email already exists';
                else if (error.code === 'auth/weak-password') message = 'Password must be at least 6 characters';
                else if (error.code === 'auth/invalid-email') message = 'Invalid email address';
                else message = error.message;
                toast(message, 'error');
            } finally {
                setLoading(btn, false);
            }
        };

        // Check if already logged in: if the browser still has a live session,
        // skip the login page entirely and jump straight to the right homepage.
        onAuthStateChanged(auth, (user) => {
            if (user) {
                getDoc(doc(db, "users", user.uid)).then(docSnap => {
                    let userData = { uid: user.uid, email: user.email, role: 'buyer' };
                    if (docSnap.exists()) userData = { ...userData, ...docSnap.data() };
                    localStorage.setItem('srinimart_user', JSON.stringify(userData));
                    if (userData.role === 'admin') window.location.href = 'admin.html';
                    else if (userData.role === 'seller') window.location.href = 'seller.html';
                    else window.location.href = 'buyer.html';
                });
            }
        });
    </script>
</body>
</html>
