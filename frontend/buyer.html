<!DOCTYPE html>
<!-- ============================================================================
  File:    buyer.html
  Purpose: The storefront — browse and search all approved products.
  ⭐ WHAT THIS PAGE IS (plain English):
     This is the main shopping page that buyers land on after login. It shows
     a search box, category filter, price filter, and sort dropdown above a
     grid of product cards. Clicking a card opens product.html; "Add to Cart"
     adds an item. The page's brain is js/buyer.js; the chat assistant
     (js/chatbot.js) also loads here. The topbar is shared by all app pages.
  Used by: buyers (and any other signed-in user).
============================================================================= -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Products - SriniMart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Shared top navigation bar (also used on cart/orders/profile/etc.).
         The user name/role/avatar and logout are filled in by the page brain.
         Cart count (#cartCount) shows how many lines are in the cart. -->
    <nav class="topbar">
        <div class="topbar-inner">
            <a href="buyer.html" class="topbar-brand">SriniMart</a>
            <div class="topbar-links">
                <a href="buyer.html" class="active">Browse</a>
                <a href="cart.html">Cart <span id="cartCount" class="badge-cart">0</span></a>
                <a href="orders.html">My Orders</a>
                <a href="profile.html">Profile</a>
            </div>
            <div class="topbar-user">
                <div class="user-avatar" id="userAvatar"></div>
                <div class="user-meta">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <button class="btn btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="page">
        <div class="page-header">
            <div class="container">
                <h1>Browse Products</h1>
                <p>Discover great deals from trusted sellers.</p>
            </div>
        </div>

        <div class="container mt-24">
            <!-- Filters -->
            <!-- Controls that narrow the product list. buyer.js listens to
                 these and reloads the grid as the user types or changes them. -->
            <div class="filter-bar">
                <div class="form-group">
                    <label>Search</label>
                    <input type="text" id="searchInput" placeholder="Search products...">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="categorySelect"><option value="">All Categories</option></select>
                </div>
                <div class="form-group">
                    <label>Max Price</label>
                    <input type="number" id="priceInput" placeholder="Any" min="0">
                </div>
                <div class="form-group">
                    <label>Sort</label>
                    <select id="sortSelect">
                        <option value="newest">Newest</option>
                        <option value="priceLow">Price: Low to High</option>
                        <option value="priceHigh">Price: High to Low</option>
                        <option value="rating">Top Rated</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="clearFiltersBtn">Clear</button>
            </div>

            <!-- Results -->
            <!-- buyer.js fills #productGrid with product cards and shows the
                 "Load More" button until all matching products are visible. -->
            <div class="flex-between mb-16">
                <h2 class="section-title" style="margin:0">All Products</h2>
                <span class="muted" id="resultCount"></span>
            </div>
            <div class="product-grid" id="productGrid"></div>
            <div id="loadMoreWrap" class="text-center mt-16" style="display:none">
                <button class="btn btn-secondary" id="loadMoreBtn">Load More</button>
            </div>
        </div>
    </div>

    <div class="toast-container"></div>

    <!-- The page brain + the floating chat assistant. -->
    <script type="module" src="js/buyer.js"></script>
    <script type="module" src="js/chatbot.js"></script>
</body>
</html>
